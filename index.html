<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Toss App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #f5576c; margin-bottom: 30px; font-size: 2.5em; }
        .coin-display {
            font-size: 5em;
            margin: 30px 0;
            animation: flip 0.6s ease-in-out;
        }
        @keyframes flip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(720deg); } }
        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 30px;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4); }
        .counters {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .counter {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .counter.active { background: #f5576c; color: white; transform: scale(1.1); }
        .counter-name { font-size: 1.3em; font-weight: bold; margin-bottom: 10px; }
        .counter-count { font-size: 1.8em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪙 Coin Toss</h1>
        <div class="coin-display" id="coin">🪙</div>
        <button onclick="tossCoin()">Toss the Coin!</button>
        <div class="counters" id="counters"></div>
    </div>

    <script>
        const coinSides = ['🪙 Heads', '🪙 Tails'];
        const counters = [0, 0];
        const coinDisplay = document.getElementById('coin');
        const countersDiv = document.getElementById('counters');

        function updateCounters() {
            countersDiv.innerHTML = counters.map((count, i) => 
                `<div class="counter"><div class="counter-name">${coinSides[i].split(' ')[1]}</div><div class="counter-count">${count}</div></div>`
            ).join('');
        }

        function tossCoin() {
            const num = Math.floor(Math.random() * 2);
            coinDisplay.classList.remove('flip');
            void coinDisplay.offsetWidth;
            coinDisplay.classList.add('flip');
            coinDisplay.textContent = coinSides[num];
            counters[num]++;
            updateCounters();
            document.querySelector(`.counter:nth-child(${num + 1})`).classList.add('active');
            setTimeout(() => document.querySelector(`.counter:nth-child(${num + 1})`).classList.remove('active'), 300);
        }
        updateCounters();
    </script>
</body>
</html>
