<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f093fb 0%, #57bef5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        .to-do-list {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #ad1529; margin-bottom: 30px; font-size: 2.5em; }
        input {
            width: 80%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 30px;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4); }
        li {
            list-style-type: none;
            background-color: #f0f0f0;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="to-do-list">
        <h1>
            Tasks Game
        </h1>
        <div>
<input type="text" placeholder="List your tasks here...">
        </div>
        <div>
<button id="add-btn">add task to the list</button>
        <button id="clear-btn">clear all tasks</button>
        </div>
        
        


    </div>
</body>
<script>
    let input = document.querySelector("input");
    let addbtn = document.getElementById("add-btn");
    let clearbtn = document.getElementById("clear-btn");

    addbtn.addEventListener("click", () => {
        let task = input.value;
        if (task) {
            let li = document.createElement("li");
            li.textContent = task;
            document.querySelector(".to-do-list").appendChild(li);
            input.value = "";
        }
    });

    clearbtn.addEventListener("click", () => {
        let tasks = document.querySelectorAll(".to-do-list li");
        tasks.forEach(task => task.remove());
    });
    document.addEventListener("mousem", (e) => {
        if (e.key === "Enter") {
            addbtn.click();
        }
    });
</script>
</html>
